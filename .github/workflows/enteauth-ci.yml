# Publish ente-auth prebuilt RPM to Fedora COPR
name: enteauth Fedora COPR CI
on:
  schedule:
    - cron: "0 00 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force a COPR rebuild even if the version is unchanged"
        type: boolean
        default: false
permissions:
  contents: write
env:
  COPR_PROJECT: enteauth
  COPR_USERNAME: anudeepd
  COPR_URL: https://copr.fedorainfracloud.org
  REPO_DEV: ente
  REPO_NAME: ente
  # ente/ente is a monorepo: desktop releases are tagged auth-vX.Y.Z,
  # so the latest-release endpoint cannot be used — filter by prefix.
  TAG_PREFIX: auth-v
  PACKAGE_NAME: enteauth
jobs:
  GetLatestVersion:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.step_version.outputs.VERSION }}
      VERSION_NO_V: ${{ steps.step_version.outputs.VERSION_NO_V }}
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Get latest auth version
        id: step_version
        run: |
          latest_release_tag=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO_DEV/$REPO_NAME/releases?per_page=100" | jq -r '[.[] | select(.tag_name | startswith(env.TAG_PREFIX)) | select(.draft != true and .prerelease != true)] | sort_by(.published_at) | last | .tag_name // empty')
          if [ -z "$latest_release_tag" ]; then echo "ERROR: tag empty"; exit 1; fi
          echo "VERSION=$latest_release_tag" >> "$GITHUB_OUTPUT"
          echo "VERSION_NO_V=$(echo "$latest_release_tag" | sed "s/^$TAG_PREFIX//")" >> "$GITHUB_OUTPUT"

  UpdateFedoraCOPR:
    needs: GetLatestVersion
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Checkout local
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
      - name: Install dependencies
        run: sudo dnf install -y -q copr-cli python3 git gawk jq curl rpm-build cpio rpmdevtools desktop-file-utils appstream chrpath binutils
      - name: Patch spec and metainfo version
        run: |
          version_no_v="${{ needs.GetLatestVersion.outputs.VERSION_NO_V }}"
          sed -i "s/^Version:.*/Version:        ${version_no_v}/" specs/enteauth.spec
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${version_no_v}\" date=\"$(date +%F)\"|" sources/io.ente.auth.metainfo.xml
          head -12 specs/enteauth.spec
      - name: Validate curated AppStream metadata
        run: |
          appstreamcli validate --no-net sources/io.ente.auth.metainfo.xml
      - name: Configure copr-cli
        run: |
          mkdir -p $HOME/.config
          cat <<EOF > $HOME/.config/copr
          [copr-cli]
          login = ${{ secrets.COPR_BUILD_L }}
          username = ${{ env.COPR_USERNAME }}
          token = ${{ secrets.COPR_BUILD_T }}
          copr_url = ${{ env.COPR_URL }}
          EOF
      - name: Decide whether to build
        id: step_decide
        run: |
          # COPR API is flaky over TLS (curl rc=56 "unexpected eof" seen on
          # GitHub runners); retry with linear backoff instead of failing the
          # scheduled run on a transient drop. HTTP/1.1 avoids h2 conn-reset
          # flakes; timeouts bound each attempt.
          set +e
          rc=1
          for attempt in 1 2 3 4 5; do
            response=$(curl -fsS --http1.1 --connect-timeout 15 --max-time 60 -w '\n%{http_code}' \
              "https://copr.fedorainfracloud.org/api_3/build/list?ownername=${{ env.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.PACKAGE_NAME }}")
            rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            echo "COPR API query attempt $attempt/5 failed (curl rc=$rc), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: COPR API query failed after 5 attempts (last curl rc=$rc)"
            exit 1
          fi
          http_code=$(printf '%s\n' "$response" | tail -1)
          body=$(printf '%s\n' "$response" | sed '$d')
          if [ "$http_code" != "200" ]; then
            echo "ERROR: COPR API returned HTTP $http_code"
            exit 1
          fi
          LATEST_COPR=$(printf '%s\n' "$body" | jq -r '[.items | sort_by(.id) | reverse[] | select(.state == "succeeded") | .source_package.version] | first // empty')
          NEW_TAG="${{ needs.GetLatestVersion.outputs.VERSION }}"
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Force rebuild requested (input force_build=true)"
            echo "START_BUILD=true" >> "$GITHUB_ENV"
          elif [ -z "$LATEST_COPR" ]; then
            echo "No succeeded COPR build yet — triggering first build"
            echo "START_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "Latest COPR = $LATEST_COPR ; new tag = $NEW_TAG"
            git_version=$(echo "$NEW_TAG" | sed "s/^$TAG_PREFIX//")
            set +e
            rpmdev-vercmp "$LATEST_COPR" "$git_version"
            rc=$?
            set -e
            # rpmdev-vercmp: 0 = equal, 11 = first newer, 12 = second newer
            if [ "$rc" -eq 12 ]; then
              echo "START_BUILD=true" >> "$GITHUB_ENV"
            else
              echo "START_BUILD=false" >> "$GITHUB_ENV"
            fi
          fi
      - name: Build SRPM and submit to COPR
        if: env.START_BUILD == 'true'
        env:
          VERSION: ${{ needs.GetLatestVersion.outputs.VERSION }}
          VERSION_NO_V: ${{ needs.GetLatestVersion.outputs.VERSION_NO_V }}
        run: |
          rpmdev-setuptree
          # Force builds get a unique Release so we never collide with an
          # existing NVR in COPR (duplicate NVRs desync repodata from the
          # stored artifact and break dnf installs). The run ID makes every
          # forced submission distinct, e.g. enteauth-4.4.25-1.f32042503024.
          if [ "${{ inputs.force_build }}" = "true" ]; then
            sed -i "s/^Release:.*/Release: %{autorelease}.f${{ github.run_id }}/" specs/enteauth.spec
          fi
          # spectool fetches the upstream RPM (Source0) and the LICENSE for
          # the exact release tag (Source1). No fallback: a failed fetch fails
          # the build so the packaged license always matches the version.
          cp sources/io.ente.auth.metainfo.xml $HOME/rpmbuild/SOURCES/
          cp specs/enteauth.spec $HOME/rpmbuild/SPECS/
          cd $HOME/rpmbuild/SPECS
          spectool -g -R enteauth.spec
          # Integrity check: the downloaded RPM must match the hash published
          # in the upstream release's SHA256SUMS file.
          # spectool downloads Source0 under its URL basename; derive the name
          # from the downloaded file rather than assuming the asset convention.
          RPM_PATH=$(ls "$HOME"/rpmbuild/SOURCES/ente-auth-*.rpm | head -1)
          RPM_FILE=${RPM_PATH##*/}
          HASH=$(sha256sum "$RPM_PATH" | awk '{print $1}')
          UPSTREAM_SUMS=$(curl -fsSL "https://github.com/$REPO_DEV/$REPO_NAME/releases/download/$VERSION/SHA256SUMS")
          # Tolerate the optional `*` that GNU sha256sum prefixes to binary
          # mode entries (upstream uses it for the .exe/.zip assets), so an
          # exact-name match on either column style works.
          EXPECTED_UPSTREAM=$(printf '%s\n' "$UPSTREAM_SUMS" | awk -v f="$RPM_FILE" '{ sub(/^\*/, "", $2) } $2==f { print $1 }')
          if [ -z "$EXPECTED_UPSTREAM" ]; then
            echo "ERROR: no hash for $RPM_FILE in upstream SHA256SUMS for $VERSION"
            exit 1
          fi
          if [ "$EXPECTED_UPSTREAM" != "$HASH" ]; then
            echo "ERROR: checksum mismatch for $RPM_FILE ($VERSION)"
            echo "upstream: $EXPECTED_UPSTREAM"
            echo "actual:   $HASH"
            exit 1
          fi
          echo "Checksum OK for $VERSION_NO_V (matches upstream SHA256SUMS)"
          rpmbuild -bs enteauth.spec
          SRPM=$(ls $HOME/rpmbuild/SRPMS/enteauth-*.src.rpm | head -1)
          echo "Submitting $SRPM to COPR"
          copr-cli build --nowait ${{ env.COPR_PROJECT }} "$SRPM"
